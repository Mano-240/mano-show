<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WEB RADIO MANO SHOW</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#2a5bd7;color:#fff;text-align:center;padding:15px}
h1{font-size:22px;margin:10px 0}
.capa{width:92%;max-width:380px;background:#000;border-radius:25px;padding:8px;margin:15px auto}
.capa img{width:100%;border-radius:18px;display:block}
.tocando{background:rgba(255,255,255,0.2);border-radius:30px;padding:12px 18px;display:flex;align-items:center;gap:12px;margin:20px auto;max-width:380px;text-align:left}
.controles{display:flex;align-items:center;justify-content:center;gap:15px;margin:25px 0}
.btn-pausar{background:#1e88e5;color:#fff;border:none;width:75%;max-width:300px;padding:20px;border-radius:30px;font-size:22px;font-weight:bold}
.btn-rec{width:75px;height:75px;background:red;border:4px solid #fff;border-radius:50%;display:flex;align-items:center;justify-content:center}
.btn-rec div{width:22px;height:22px;background:#fff;border-radius:50%}
.rodape{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:35px}
.item{display:flex;flex-direction:column;align-items:center;text-decoration:none;color:#fff;cursor:pointer;min-width:60px}
.bola{width:62px;height:62px;background:#1e88e5;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:bold}
.nome{font-size:12px;margin-top:6px}
</style>
</head>
<body>

<h1>WEB RADIO MANO SHOW</h1>

<div class="capa"><img id="capa" src="https://i.imgur.com/8Km9tLL.jpg"></div>

<div class="tocando">
<div style="width:55px;height:55px;background:rgba(0,0,0,0.2);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px">♫</div>
<div><small>Tocando agora</small><br><b id="musica">Raul Seixas - Meu amigo Pedro</b></div>
</div>

<div class="controles">
<button class="btn-pausar" id="playBtn" onclick="toggle()">|| PAUSAR</button>
<div class="btn-rec"><div></div></div>
</div>

<audio id="radio" src="https://stream.zeno.fm/0r0xa7x8f2zuv" autoplay></audio>

<!-- BOTOES DO FINAL -->
<div class="rodape">
<a class="item" href="#"><div class="bola">W</div><span class="nome">Whats</span></a>
<a class="item" href="#"><div class="bola">f</div><span class="nome">Face</span></a>
<a class="item" href="#"><div class="bola">◎</div><span class="nome">Insta</span></a>
<a class="item" href="#"><div class="bola">♪</div><span class="nome">TikTok</span></a>
<a class="item" href="https://youtube.com/@manoshow"><div class="bola">▶</div><span class="nome">YouTube</span></a>
<div class="item" onclick="document.getElementById('menuEmail').style.display='flex'"><div class="bola">☰</div><span class="nome">Menu</span></div>
</div>

<!-- MENU COM EMAIL -->
<div id="menuEmail" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.96);z-index:999;flex-direction:column;align-items:center;justify-content:center">
<button onclick="document.getElementById('menuEmail').style.display='none'" style="position:absolute;top:20px;right:20px;background:none;border:none;color:#fff;font-size:35px">X</button>
<p style="color:#888;letter-spacing:5px;font-size:14px">EMAIL</p>
<p style="background:#1e88e5;padding:18px 25px;border-radius:12px;font-size:20px;margin-top:15px">manoshowwebradio@gmail.com</p>
<a href="mailto:manoshowwebradio@gmail.com" style="background:red;color:#fff;padding:12px 25px;border-radius:30px;text-decoration:none;margin-top:20px;font-weight:bold">ENVIAR EMAIL</a>
</div>

<script>
const radio=document.getElementById('radio');
const btn=document.getElementById('playBtn');
function toggle(){if(radio.paused){radio.play();btn.innerText='|| PAUSAR'}else{radio.pause();btn.innerText='▶ OUVIR'}}
</script>
</body>
</html>
