<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WEB RADIO MANO SHOW</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}body{background:linear-gradient(180deg,#0a2fb8 0%,#2a6bf0 55%,#0a8cff 100%);min-height:100vh;color:#fff;text-align:center;padding:12px}.topo{background:#ff2a2a;color:#fff;padding:8px 20px;border-radius:20px;font-size:13px;font-weight:900;display:inline-block;margin:12px 0 22px}.capa{width:86%;max-width:360px;background:#000;border-radius:18px;overflow:hidden;margin:0 auto 20px;box-shadow:0 10px 25px rgba(0,0,0,.4);height:360px;position:relative}.capa img{width:100%;height:100%;object-fit:cover;display:block}.tocando{background:rgba(180,210,255,.92);color:#1a2a4a;border-radius:50px;padding:12px 18px;display:flex;align-items:center;gap:12px;max-width:390px;margin:0 auto 26px;text-align:left;min-height:68px}.controles{display:flex;align-items:center;justify-content:center;gap:16px;max-width:390px;margin:0 auto 38px}.btn-pausar{background:#1876f5;color:#fff;border:none;flex:1;padding:22px;border-radius:50px;font-size:28px;font-weight:900;cursor:pointer}.btn-rec{width:78px;height:78px;background:#ff1f1f;border-radius:50%;display:flex;align-items:center;justify-content:center}.botoes{display:flex;justify-content:center;gap:12px;max-width:410px;margin:0 auto}.item{color:#fff;text-decoration:none;display:flex;flex-direction:column;align-items:center;min-width:56px}.bola{width:56px;height:56px;background:#1876f5;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900}.nome{font-size:11px;margin-top:6px;font-weight:700}</style></head><body>
<div class="topo">● AO VIVO BLUMENAU SC</div><h1 style="font-size:27px;font-weight:900;margin-bottom:20px">WEB RADIO MANO SHOW</h1>

<div class="controles"><button class="btn-pausar" id="playBtn">▶ OUVIR</button><div onclick="window.open('https://wa.me/554791452690')" style="cursor:pointer;text-align:center"><div class="btn-rec"><div style="width:22px;height:22px;background:#fff;border-radius:50%"></div></div><div style="margin-top:6px;color:#ff2a2a;font-weight:900">REC</div></div></div>
<audio id="rd" preload="none"><source src="https://stream.zeno.fm/0r0xa7x8f2zuv" type="audio/mpeg"></audio>

<script>
const rd=document.getElementById('rd'),bt=document.getElementById('playBtn'),tt=document.getElementById('tit'),at=document.getElementById('art'),cp=document.getElementById('capaImg');
const LOGO="logo.png"; let tocando=false;
bt.onclick=async()=>{try{if(!tocando){await rd.play();bt.textContent='II PAUSAR';tocando=true}else{rd.pause();bt.textContent='▶ OUVIR';tocando=false}}catch(e){alert('Clique de novo em OUVIR para liberar o áudio');}};
async function buscaCapa(nome){try{const r=await fetch('https://itunes.apple.com/search?term='+encodeURIComponent(nome)+'&limit=1&media=music');const j=await r.json();if(j.results[0]){at.textContent=j.results[0].artistName;return j.results[0].artworkUrl100.replace('100x100','600x600');}}catch(e){}return null;}
async function atualiza(){try{const r=await fetch('https://api.allorigins.win/get?url='+encodeURIComponent('https://api.zeno.fm/mounts/metadata/subscribe/0r0xa7x8f2zuv?cb='+Date.now()));const data=await r.json();const txt=data.contents;const m=txt.match(/"streamTitle":"([^"]+)"/);if(m&&m[1]){let nome=m[1].trim();if(nome && nome.length>3 && nome.toLowerCase().indexOf('mano')==-1){tt.textContent=nome;const capa=await buscaCapa(nome);if(capa){cp.src=capa;} else {cp.src=LOGO;} return;}}}catch(e){}tt.textContent="WEB RADIO MANO SHOW AO VIVO";at.textContent="Blumenau SC";cp.src=LOGO;}
atualiza();setInterval(atualiza,8000);
</script></body></html>
