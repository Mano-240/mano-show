<script>
const r=document.getElementById('radio'), b=document.getElementById('play'), g=document.getElementById('gravar'), n=document.getElementById('nome'), capa=document.getElementById('capa'), recTag=document.getElementById('REC');
let gravador, chunks=[];
b.onclick=async()=>{if(r.paused){await r.play();b.textContent='⏸️ PAUSAR'}else{r.pause();b.textContent='▶️ OUVIR'}};
g.onclick=()=>{
  if(!gravador || gravador.state=='inactive'){
    let stream = r.captureStream ? r.captureStream() : r.mozCaptureStream();
    gravador = new MediaRecorder(stream);
    chunks=[];
    gravador.ondataavailable=e=>chunks.push(e.data);
    gravador.onstop=()=>{
      let blob=new Blob(chunks,{type:'audio/mp3'});
      let url=URL.createObjectURL(blob);
      let a=document.createElement('a'); a.href=url; a.download='mano-show-gravacao.mp3'; a.click();
    };
    gravador.start();
    g.textContent='⏹️ PARAR'; recTag.style.display='block';
  }else{
    gravador.stop();
    g.textContent='⏺️ GRAVAR'; recTag.style.display='none';
  }
};
async function busca(){
 try{
  let u='https://api.allorigins.win/get?url='+encodeURIComponent('https://zenoplay.zenomedia.com/api/zenofm/now-playing/0ctt516rnhovv');
  let res=await fetch(u); let data=await res.json(); let j=JSON.parse(data.contents);
  if(j.title){ n.textContent=j.title; if(j.image) capa.src=j.image; }
 }catch(e){}
}
setInterval(busca,5000); busca();
