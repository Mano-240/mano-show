<script>
const aud=document.getElementById('aud'),mus=document.getElementById('mus'),capa=document.getElementById('capa'),btnP=document.getElementById('btnP'),menu=document.getElementById('menu');
let ctx,src,dst,mr,ch=[],grav=false,ultima='';
function tocar(){if(aud.paused){aud.play();btnP.innerText='II PAUSAR'}else{aud.pause();btnP.innerText='▶ OUVIR'}}
function abrirMenu(){menu.classList.add('aberto')}
function fecharMenu(){menu.classList.remove('aberto')}
async function gravar(){try{if(!grav){if(aud.paused){await aud.play();btnP.innerText='II PAUSAR'}if(!ctx){ctx=new AudioContext();src=ctx.createMediaElementSource(aud);dst=ctx.createMediaStreamDestination();src.connect(dst);src.connect(ctx.destination)}ch=[];mr=new MediaRecorder(dst.stream);mr.ondataavailable=e=>ch.push(e.data);mr.onstop=()=>{let b=new Blob(ch,{type:'audio/webm'});let u=URL.createObjectURL(b);let a=document.createElement('a');a.href=u;a.download='mano-show-'+Date.now()+'.webm';a.click()};mr.start();grav=true;mus.innerText='🔴 GRAVANDO'}else{mr.stop();grav=false;mus.innerText='Salvo!';setTimeout(busca,1500)}}catch(e){alert(e.message)}}
async function buscarCapa(nome){try{let r=await fetch('https://api.allorigins.win/raw?url='+encodeURIComponent('https://itunes.apple.com/search?term='+encodeURIComponent(nome)+'&media=music&limit=1'));let j=await r.json();if(j.results&&j.results[0]?.artworkUrl100){capa.src=j.results[0].artworkUrl100.replace('100x100bb','600x600bb');capa.classList.add('on')}}catch{}}
async function busca(){if(grav)return;try{let r=await fetch('https://api.allorigins.win/raw?url='+encodeURIComponent('https://zenoplay.zenomedia.com/api/zenofm/nowplaying/0ctt516rnhovv'),{cache:'no-store'});let j=await r.json();let t=j.title||j?.data?.title;let img=j.image||j?.data?.image;if(t&&t!==ultima){ultima=t;mus.innerText=t;if(img){capa.src=img;capa.classList.add('on')}else{buscarCapa(t)}}}catch{}}
setInterval(busca,6000);busca();
</script>
