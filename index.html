<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mano Show Web Rádio</title>
<style>
body{margin:0;background:#1e64ff;font-family:Arial,sans-serif;text-align:center;color:#fff;padding-bottom:110px}
.capa{width:92%;margin:15px auto;border-radius:30px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,0.4);background:#000;height:340px}
.capa img{width:100%;height:100%;object-fit:cover;display:block}
.tocando{background:#eef2ff;color:#1a2a5a;width:92%;margin:15px auto;padding:12px 15px;border-radius:30px;text-align:left;display:flex;align-items:center;gap:10px;font-weight:bold;font-size:14px}
.tocando span{color:#111;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.controles{display:flex;justify-content:space-between;align-items:center;width:92%;margin:25px auto;gap:15px}
.btn-ouvir{background:#174fe0;width:68%;padding:20px;border:none;border-radius:30px;color:white;font-size:32px;font-weight:900;display:flex;align-items:center;justify-content:center;gap:10px}
.btn-gravar{background:#ff0000;width:90px;height:90px;border-radius:50%;border:4px solid white;display:flex;align-items:center;justify-content:center;cursor:pointer}
.btn-gravar span{background:white;width:32px;height:32px;border-radius:50%;display:block}
.btn-gravar.gravando{animation:piscar 1s infinite}
@keyframes piscar{0%{opacity:1}50%{opacity:0.4}100%{opacity:1}}
.menu-baixo{position:fixed;bottom:0;left:0;right:0;background:#1e64ff;padding:10px 5px;display:flex;justify-content:space-around}
.item-menu{display:flex;flex-direction:column;align-items:center;text-decoration:none;color:white;font-size:10px;font-weight:bold;min-width:55px}
.circulo{background:#174fe0;width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;border:2px solid rgba(255,255,255,0.2);margin-bottom:4px}
audio{display:none}
</style>
</head>
<body>

<div class="capa"><img id="capaArtista" src="https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?w=600"></div>

<div class="tocando">
<div style="font-size:26px">🎵</div>
<div><div style="font-weight:400;font-size:12px">Tocando agora</div><span id="nomeMusica">Mano Show Web Rádio - Ao Vivo</span></div>
</div>

<audio id="player" preload="none" crossorigin="anonymous"><source src="https://stream.zeno.fm/0ctt516rnhovv" type="audio/mpeg"></audio>

<div class="controles">
<button class="btn-ouvir" id="btnOuvir">▶️ OUVIR</button>
<button class="btn-gravar" id="btnGravar"><span></span></button>
</div>
<p id="status" style="font-size:13px;height:18px;color:yellow;font-weight:bold"></p>

<div class="menu-baixo">
<a href="https://wa.me/5547991452690" class="item-menu"><div class="circulo">W</div>WhatsApp</a>
<a href="https://www.facebook.com/share/18wbZj1F72/" class="item-menu"><div class="circulo">f</div>Facebook</a>
<a href="https://www.instagram.com/manoshow.oficial" class="item-menu"><div class="circulo">◎</div>Instagram</a>
<a href="https://www.tiktok.com/@manoshowwebradio" class="item-menu"><div class="circulo">♪</div>TikTok</a>
<a href="https://youtube.com/@webradiomanoshow" class="item-menu"><div class="circulo">▶️</div>YouTube</a>
<a href="#" class="item-menu"><div class="circulo">≡</div>Menu</a>
</div>

<script>
const player=document.getElementById('player');
const btnOuvir=document.getElementById('btnOuvir');
const btnGravar=document.getElementById('btnGravar');
const status=document.getElementById('status');
const nomeMusicaEl=document.getElementById('nomeMusica');
const capaEl=document.getElementById('capaArtista');
let tocando=false;

btnOuvir.onclick=async()=>{
 if(!tocando){await player.play();btnOuvir.innerHTML='⏸️ PAUSAR';tocando=true;}
 else{player.pause();btnOuvir.innerHTML='▶️ OUVIR';tocando=false;}
};

// NOME E CAPA - AGORA FUNCIONA NO CELULAR
async function pegaMusica(){
 try{
  const proxy='https://api.allorigins.win/get?url='+encodeURIComponent('https://api.zeno.fm/mounts/metadata/subscribe/0ctt516rnhovv');
  const r=await fetch(proxy);
  const d=await r.json();
  const t=d.contents;
  const m=t.match(/"title":"(.*?)"/);
  if(m && m[1] && m[1].length>2){
   if(nomeMusicaEl.innerText!==m[1]) nomeMusicaEl.innerText=m[1];
   const it=await fetch('https://itunes.apple.com/search?term='+encodeURIComponent(m[1])+'&limit=1');
   const j=await it.json();
   if(j.results && j.results[0]) capaEl.src=j.results[0].artworkUrl100.replace('100x100','600x600');
  }
 }catch(e){}
}
setInterval(pegaMusica,8000); pegaMusica();

// GRAVADOR QUE SALVA COMO MÚSICA
let gravando=false,chunks=[],control;
btnGravar.onclick=async()=>{
 if(!gravando){
  gravando=true;chunks=[];btnGravar.classList.add('gravando');status.innerText='🔴 Gravando... clique de novo pra salvar';
  try{
   control=new AbortController();
   const res=await fetch('https://stream.zeno.fm/0ctt516rnhovv',{signal:control.signal});
   const reader=res.body.getReader();
   while(gravando){const{value,done}=await reader.read();if(done)break;chunks.push(value);}
  }catch(e){}
 }else{
  gravando=false;btnGravar.classList.remove('gravando');if(control)control.abort();
  const blob=new Blob(chunks,{type:'audio/mpeg'});const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=(nomeMusicaEl.innerText||'ManoShow')+'.mp3';a.click();
  status.innerText='✅ Salvo em Downloads!';setTimeout(()=>status.innerText='',4000);
 }
};
</script>
</body>
</html>
