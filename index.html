<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MANO Web Rádio - Ao Vivo</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#fff;font-family:Arial,sans-serif;text-align:center;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.live{color:#ff0000;font-weight:bold;letter-spacing:2px;animation:blink 1s infinite}
@keyframes blink{50%{opacity:0.5}}
h1{font-size:48px;margin:15px 0;color:#ffcc00;text-shadow:2px 2px 4px #000}
.player-box{background:#1a1a1a;padding:30px;border-radius:20px;margin:20px 0;border:2px solid #ffcc00;width:100%;max-width:400px}
#playBtn{background:#ffcc00;color:#000;border:none;padding:20px 50px;font-size:22px;font-weight:bold;border-radius:50px;cursor:pointer;width:100%}
#playBtn:hover{transform:scale(1.05);background:#fff}
#status{margin-top:15px;font-size:16px;color:#aaa}
.socials{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:20px}
.socials a{background:#222;color:#fff;text-decoration:none;padding:12px 18px;border-radius:10px;font-weight:bold}
.socials a:hover{background:#ffcc00;color:#000}
.menu-btn{position:fixed;top:15px;right:15px;background:#ffcc00;color:#000;padding:10px 15px;border-radius:8px;font-weight:bold;cursor:pointer;z-index:1000}
.side-menu{position:fixed;top:0;right:-300px;width:280px;height:100%;background:#111;padding:20px;transition:0.3s;z-index:999;border-left:2px solid #ffcc00;text-align:left;overflow-y:auto}
.side-menu.open{right:0}
.side-menu a{display:block;color:#fff;text-decoration:none;padding:10px 0;border-bottom:1px solid #333}
.side-menu .close{text-align:right;font-size:24px;cursor:pointer;margin-bottom:10px}
</style>
</head>
<body>
<div class="menu-btn" onclick="toggleMenu()">☰ MENU</div>
<div class="side-menu" id="sideMenu">
<div class="close" onclick="toggleMenu()">X</div>
<h3 style="color:#ffcc00">MENU</h3>
<a href="mailto:manoshowwebradio@gmail.com">📧 Email</a>
<a href="https://wa.me/554791452690" target="_blank">📱 WhatsApp</a>
<a href="#">📘 Facebook</a>
<a href="#">📸 Instagram</a>
<a href="#">🎵 TikTok</a>
<a href="#">▶️ YouTube</a>
</div>
<div class="live">🔴 AO VIVO DIRETO DE BLUMENAU</div>
<h1>MANO SHOW</h1>
<p style="color:#aaa">Toque para ouvir</p>
<div class="player-box">
<button id="playBtn" onclick="togglePlay()">▶️ TOCAR</button>
<div id="status">Rádio parada</div>
<audio id="radio" preload="none">
<source src="https://stream.zeno.fm/urlp8wipknauv" type="audio/mpeg">
</audio>
</div>
<div class="socials">
<a href="https://wa.me/554791452690" target="_blank">WHATSAPP</a>
<a href="#">FACEBOOK</a>
<a href="#">INSTAGRAM</a>
</div>
<script>
let isPlaying=false;
const audio=document.getElementById('radio');
const btn=document.getElementById('playBtn');
const status=document.getElementById('status');
function togglePlay(){
 if(isPlaying){audio.pause();btn.innerHTML='▶️ TOCAR';status.innerHTML='Rádio parada';isPlaying=false;}
 else{audio.play().then(()=>{btn.innerHTML='⏸️ PAUSAR';status.innerHTML='Tocando ao vivo...';isPlaying=true;}).catch(e=>{status.innerHTML='Clique novamente';});}
}
function toggleMenu(){document.getElementById('sideMenu').classList.toggle('open');}
</script>
</body>
</html>
