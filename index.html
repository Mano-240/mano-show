<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1570ff;font-family:Arial;padding-bottom:100px}
.topo{margin:14px;background:#000;border-radius:26px;aspect-ratio:1/1;position:relative;overflow:hidden}
.topo img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
#capa{z-index:2;opacity:0;transition:.5s}
#capa.on{opacity:1}
.faixa{margin:16px 14px;background:#c7dcff;border-radius:50px;display:flex;align-items:center;gap:12px;padding:10px 14px}
#mus{font-size:13px;color:#0c234f;font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.meio{display:flex;padding:18px 14px;align-items:center}
.btnP{flex:1;background:rgba(0,0,0,.15);border:0;border-radius:28px;color:#fff;font-size:28px;font-weight:900;padding:20px 0}
.btnR{width:88px;height:88px;background:#ff0c0c;border:4px solid #fff;border-radius:50%;margin-left:12px;color:#fff;font-size:30px}
.bar{position:fixed;bottom:0;left:0;right:0;background:#1570ff;display:flex;padding:8px 0 12px;z-index:10}
.b{flex:1;text-align:center;color:#fff;text-decoration:none;font-size:10px;font-weight:700;background:none;border:0;display:flex;flex-direction:column;align-items:center}
.c{width:58px;height:58px;background:#0d57d8;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;margin:0 auto 5px;color:#fff;border:2px solid rgba(255,255,255,.3)}
#menu{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:99;display:none;align-items:end}
#menu.aberto{display:flex}
.menuBox{background:#fff;width:100%;border-radius:26px 26px 0 0;padding:22px}
.menuBox a{display:block;padding:14px 0;border-bottom:1px solid #eee;text-decoration:none;color:#000;font-weight:bold}
</style>
</head>
<body>
<div class="topo"><img src="logo.png"><img id="capa"></div>
<div class="faixa"><div>🎵</div><div><small>Tocando agora</small><b id="mus">MANO SHOW - Ao vivo</b></div></div>
<div class="meio"><button class="btnP" id="btnP" onclick="tocar()">▶ OUVIR</button><button class="btnR" id="btnR" onclick="gravar()">●</button></div>
<audio id="aud" crossorigin="anonymous" src="https://stream.zeno.fm/0ctt516rnhovv"></audio>
<div id="menu" onclick="fecharMenu()"><div class="menuBox" onclick="event.stopPropagation()"><h2>MANO SHOW</h2><a href="https://wa.me/5547991452690">📱 WhatsApp (47) 99145-2690</a><a href="mailto:manoshowwebradio@gmail.com">📧 manoshowwebradio@gmail.com</a><a href="https://www.instagram.com/manoshow.oficial" target="_blank">Instagram</a><a href="https://www.facebook.com/share/1JwFP1k1Kb/" target="_blank">Facebook</a><a href="https://www.tiktok.com/@manoshowwebradio" target="_blank">TikTok</a><a href="https://youtube.com/@webradiomanoshow" target="_blank">YouTube</a><a href="#" onclick="fecharMenu()" style="color:red;text-align:center">FECHAR</a></div></div>
<div class="bar"><a class="b" href="https://wa.me/5547991452690" target="_blank"><div class="c">W</div>WhatsApp</a><a class="b" href="https://www.facebook.com/share/1JwFP1k1Kb/" target="_blank"><div class="c">f</div>Facebook</a><a class="b" href="https://www.instagram.com/manoshow.oficial" target="_blank"><div class="c">◎</div>Instagram</a><a class="b" href="https://www.tiktok.com/@manoshowwebradio" target="_blank"><div class="c">♪</div>TikTok</a><a class="b" href="https://youtube.com/@webradiomanoshow" target="_blank"><div class="c">▶</div>YouTube</a><button class="b" onclick="abrirMenu()"><div class="c">☰</div>Menu</button></div>
<script>
const aud=document.getElementById('aud'),mus=document.getElementById('mus'),capa=document.getElementById('capa'),btnP=document.getElementById('btnP'),btnR=document.getElementById('btnR'),menu=document.getElementById('menu');
let ctx,src,dst,mr,ch=[],grav=false,ultima='',ganho;
function tocar(){if(aud.paused){aud.play();btnP.innerText='II PAUSAR'}else{aud.pause();btnP.innerText='▶ OUVIR'}}
function abrirMenu(){menu.classList.add('aberto')}
function fecharMenu(){menu.classList.remove('aberto')}
async function gravar(){
  try{
    if(!grav){
      if(aud.paused){await aud.play();btnP.innerText='II PAUSAR'}
      if(!ctx){
        ctx=new AudioContext();
        src=ctx.createMediaElementSource(aud);
        dst=ctx.createMediaStreamDestination();
        ganho=ctx.createGain();ganho.gain.value=1.5;
        src.connect(ganho);ganho.connect(ctx.destination);ganho.connect(dst);
      }
      aud.volume=1;ch=[];mr=new MediaRecorder(dst.stream);
      mr.ondataavailable=e=>ch.push(e.data);
      mr.onstop=()=>{let b=new Blob(ch,{type:'audio/webm'});let u=URL.createObjectURL(b);let a=document.createElement('a');a.href=u;a.download='mano-show-'+Date.now()+'.webm';a.click();};
      mr.start();grav=true;btnR.style.background='#fff';btnR.style.color='#f00';mus.innerText='🔴 GRAVANDO';
    }else{mr.stop();grav=false;btnR.style.background='#ff0c0c';btnR.style.color='#fff';mus.innerText='Salvo!';setTimeout(()=>{ultima='';busca()},1000);}
  }catch(e){alert(e.message)}
}
async function buscarCapa(nome){
  try{
    let r=await fetch('https://itunes.apple.com/search?term='+encodeURIComponent(nome)+'&media=music&limit=1');
    let j=await r.json();
    if(j.results&&j.results[0]?.artworkUrl100){capa.src=j.results[0].artworkUrl100.replace('100x100bb','600x600bb');capa.classList.add('on');}
  }catch{}
}
async function busca(){
  if(grav) return;
  try{
    let r=await fetch('https://api.zeno.fm/mounts/metadata/0ctt516rnhovv',{cache:'no-store'});
    let j=await r.json();
    let nome=j.title|| (j.artist? j.artist+' - '+j.title : '') || j.now_playing || '';
    if(j.artist && j.title) nome = j.artist+' - '+j.title;
    if(nome && nome!==ultima && nome.length>2){ultima=nome;mus.innerText=nome;buscarCapa(nome);return;}
  }catch{}
  try{
    let r=await fetch('https://api.allorigins.win/raw?url='+encodeURIComponent('https://api.zeno.fm/mounts/metadata/0ctt516rnhovv'),{cache:'no-store'});
    let t=await r.text();
    let m=t.match(/"title":"([^"]+)"/);
    if(m && m[1]!==ultima && m[1].length>2){ultima=m[1];mus.innerText=m[1];buscarCapa(m[1]);}
  }catch{}
}
setInterval(busca,4000);
busca();
</script>
</body>
</html>
