<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial;background:#1e4bb8;color:#fff;min-height:100vh;padding-bottom:90px}
.badge{text-align:center;padding-top:25px}
.badge span{background:#ff0000;color:#fff;padding:10px 28px;border-radius:25px;font-weight:900;font-size:14px}
.badge span::before{content:"● ";animation:pisca 1s infinite}
@keyframes pisca{0%,100%{opacity:1}50%{opacity:0}}
h1{text-align:center;font-size:28px;margin:20px 10px;font-weight:900}
.cover{width:88%;max-width:380px;margin:20px auto;border-radius:20px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,0.6)}
.cover img{width:100%;display:block}
.play-big{background:#fff;color:#1e4bb8;width:75px;height:75px;border-radius:50%;border:none;font-size:32px;margin:20px auto;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 5px 15px rgba(0,0,0,0.3)}
.socials{display:flex;justify-content:center;gap:12px;margin:20px 0}
.socials a{width:48px;height:48px;background:rgba(255,255,255,0.2);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:21px;text-decoration:none}
.player{width:92%;max-width:400px;margin:0 auto;background:#c7d7ff;border-radius:25px;padding:14px 18px;color:#1e3a8a;display:flex;align-items:center;gap:12px;position:fixed;bottom:10px;left:50%;transform:translateX(-50%);box-shadow:0 -2px 20px rgba(0,0,0,0.3)}
.player i{font-size:24px;color:#7c3aed;background:#fff;min-width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.tocando{flex:1;overflow:hidden}
.tocando small{font-size:12px}
.tocando div{font-weight:bold;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu-btn{position:fixed;left:12px;top:12px;background:rgba(0,0,0,0.3);color:#fff;border:none;width:44px;height:44px;border-radius:10px;font-size:22px;z-index:500;backdrop-filter:blur(5px)}
.sidebar{position:fixed;top:0;left:-280px;width:270px;height:100%;background:#111827;padding:20px;transition:0.3s;z-index:1001}
.sidebar.open{left:0}
.sidebar a{color:#fff;text-decoration:none;display:flex;gap:12px;padding:14px 0;border-bottom:1px solid #222;font-size:14px}
.overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);display:none;z-index:1000}
.overlay.show{display:block}
</style>
</head>

<script>
