<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mano Show</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f0f0f;color:#fff;font-family:Arial,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.card{background:#1c1c1c;padding:25px;border-radius:25px;max-width:360px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.6)}
#capaImg{width:100%;aspect-ratio:1/1;border-radius:20px;object-fit:cover;background:#222;display:block}
#tit{margin:18px 0 15px 0;font-size:19px;font-weight:bold;line-height:1.3;min-height:48px;text-align:center}
.controles{display:flex;gap:10px;justify-content:center}
button{flex:1;padding:14px;border-radius:30px;border:none;font-weight:bold;font-size:15px;cursor:pointer}
#playBtn{background:#ffcc00;color:#000}
#recBtn{background:#222;color:#fff;border:1px solid #333}
#recBtn.gravando{background:#ff2d2d;color:#fff;animation:piscar 1s infinite}
@keyframes piscar{0%{opacity:1}50%{opacity:.5}100%{opacity:1}}
.logo-topo{font-size:13px;opacity:.6;margin-bottom:12px;letter-spacing:2px;text-align:center}
</style>
</head>
<body>

<div class="card">
<div class="logo-topo">MANO SHOW</div>
<img id="capaImg" src="https://i.imgur.com/8QJ4sQc.png" alt="Capa">
<div id="tit">Carregando...</div>
<audio id="rd" src="https://stream.zeno.fm/0ctt516rnhovv" preload="none"></audio>
<div class="controles">
<button id="playBtn">▶ OUVIR</button>
<button id="recBtn">● GRAVAR</button>
</div>
</div>

<script>
const STREAM_ID="0ctt516rnhovv";
const rd=document.getElementById('rd');
const bt=document.getElementById('playBtn');
const tt=document.getElementById('tit');
const cp=document.getElementById('capaImg');
const recBtn=document.getElementById('recBtn');
let tocando=false;

bt.onclick=async()=>{
 try{
  if(!tocando){await rd.play();bt.textContent='II PAUSAR';tocando=true}
  else{rd.pause();bt.textContent='▶ OUVIR';tocando=false}
 }catch(e){}
};

let mediaRecorder=null,chunks=[],gravando=false;
recBtn.onclick=async()=>{
 if(!gravando){
  if(!tocando){alert('Dê PLAY antes');return;}
  try{
   let stream=rd.captureStream?rd.captureStream():rd.mozCaptureStream();
   mediaRecorder=new MediaRecorder(stream);chunks=[];
   mediaRecorder.ondataavailable=e=>{if(e.data.size>0)chunks.push(e.data)};
   mediaRecorder.onstop=()=>{
    let blob=new Blob(chunks,{type:'audio/webm'});
    let url=URL.createObjectURL(blob);
    let a=document.createElement('a');a.href=url;a.download='mano-show-'+Date.now()+'.webm';a.click();
   };
   mediaRecorder.start();gravando=true;recBtn.textContent='■ PARAR';recBtn.classList.add('gravando');
  }catch(err){alert('Use Chrome para gravar');}
 }else{
  if(mediaRecorder)mediaRecorder.stop();
  gravando=false;recBtn.textContent='● GRAVAR';recBtn.classList.remove('gravando');
 }
};

async function buscaCapaAutomatica(nome){
 try{
  let r=await fetch('https://itunes.apple.com/search?term='+encodeURIComponent(nome)+'&media=music&limit=1');
  let j=await r.json();
  if(j.results&&j.results[0])return j.results[0].artworkUrl100.replace('100x100','600x600');
 }catch(e){}
 return null;
}

async function atualiza(){
 try{
  let r=await fetch('https://zenoplay.zenomedia.com/api/zenofm/nowplaying/'+STREAM_ID+'?t='+Date.now());
  let j=await r.json();
  if(j.title){
    tt.textContent=j.title;
    let img=j.image||j.artwork||j.cover;
    if(img){cp.src=img;}
    else{let capaAuto=await buscaCapaAutomatica(j.title);if(capaAuto)cp.src=capaAuto;}
  }
 }catch(e){}
}
atualiza();
setInterval(atualiza,7000);
</script>
</body>
</html>
