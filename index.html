<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MANO SHOW</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1570ff;font-family:Arial, sans-serif;min-height:100vh;padding-bottom:95px}
.topo{margin:14px;background:#000;border-radius:26px;aspect-ratio:1/1;position:relative;overflow:hidden}
.topo img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
#capa{z-index:2;opacity:0;transition:.5s}
#capa.on{opacity:1}
.faixa{margin:16px 14px;background:#c7dcff;border-radius:50px;display:flex;align-items:center;gap:12px;padding:10px 14px}
.faixa .ic{width:46px;height:46px;background:#9cc2ff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
#mus{font-size:14px;color:#0c234f;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px;display:block;font-weight:bold}
.meio{display:flex;padding:18px 14px;align-items:center;justify-content:space-between}
.btnP{flex:1;background:rgba(0,0,0,.10);border:0;border-radius:28px;color:#fff;font-size:30px;font-weight:900;padding:20px 0}
.btnR{width:88px;height:88px;background:#ff0c0c;border:4px solid #fff;border-radius:50%;margin-left:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.btnR:after{content:'';width:28px;height:28px;background:#fff;border-radius:50%}
.btnR.gravando{animation:pisca .8s infinite}
@keyframes pisca{50%{opacity:.5;transform:scale(.9)}}
.bar{position:fixed;bottom:0;left:0;right:0;background:#1570ff;display:flex;padding:8px 0 10px;border-top:1px solid rgba(0,0,0,.1)}
.b{flex:1;text-align:center;color:#fff;text-decoration:none;font-size:10px;font-weight:700;background:none;border:0}
.b .c{width:54px;height:54px;background:#0d57d8;border-radius:50%;margin:0 auto 4px;display:flex;align-items:center;justify-content:center;font-size:22px}
</style>
</head>
<body>
<div class="topo"><img id="logo" src="logo.png"><img id="capa" src=""></div>
<div class="faixa"><div class="ic">🎵</div><div><small style="font-size:12px;color:#333">Tocando agora</small><b id="mus">Carregando música...</b></div></div>
<div class="meio"><button class="btnP" id="btnP" onclick="tocar()">▶ OUVIR</button><button class="btnR" id="btnR" onclick="rec()"></button></div>
<audio id="aud" src="https://stream.zeno.fm/0ctt516rnhovv" crossorigin="anonymous"></audio>
<div class="bar">
<a class="b" href="https://wa.me/5547991452690" target="_blank"><div class="c">W</div>WhatsApp</a>
<a class="b" href="https://www.facebook.com/share/1JwFP1k1Kb/" target="_blank"><div class="c">f</div>Facebook</a>
<a class="b" href="https://www.instagram.com/manoshow.oficial" target="_blank"><div class="c">◎</div>Instagram</a>
<a class="b" href="https://www.tiktok.com/@manoshowwebradio" target="_blank"><div class="c">♪</div>TikTok</a>
<a class="b" href="https://youtube.com/@webradiomanoshow" target="_blank"><div class="c">▶</div>YouTube</a>
<button class="b" onclick="alert('Menu em breve')"><div class="c">☰</div>Menu</button>
</div>
<script>
const aud=document.getElementById('aud'), mus=document.getElementById('mus'), capa=document.getElementById('capa'), btnP=document.getElementById('btnP');
function tocar(){if(aud.paused){aud.play();btnP.innerText='II PAUSAR'}else{aud.pause();btnP.innerText='▶ OUVIR'}}
let mr, ch=[], grav=false;
async function rec(){const b=document.getElementById('btnR');if(!grav){if(aud.paused) await aud.play();try{const s=aud.captureStream?aud.captureStream():aud.mozCaptureStream();mr=new MediaRecorder(s);ch=[];mr.ondataavailable=e=>ch.push(e.data);mr.onstop=()=>{const bl=new Blob(ch,{type:'audio/webm'});const u=URL.createObjectURL(bl);const a=document.createElement('a');a.href=u;a.download='manoshow.webm';a.click()};mr.start();grav=true;b.classList.add('gravando')}catch{alert('Aperte OUVIR primeiro')}}else{mr.stop();grav=false;b.classList.remove('gravando')}}
async function busca(){
 const api='https://zenoplay.zenomedia.com/api/zenofm/nowplaying/0ctt516rnhovv';
 const proxies=[
  'https://corsproxy.io/?'+encodeURIComponent(api),
  'https://api.allorigins.win/raw?url='+encodeURIComponent(api),
  'https://api.codetabs.com/v1/proxy?quest='+encodeURIComponent(api)
 ];
 for(let url of proxies){
  try{
   const r=await fetch(url,{cache:'no-store'});
   if(!r.ok) continue;
   const j=await r.json();
   console.log('API',j);
   let titulo=j.title||j?.data?.title||j?.nowPlaying?.title;
   if(j?.data?.artist) titulo=(j.data.artist+' - '+(j.data.title||''));
   let imagem=j.image||j?.data?.image||j?.data?.imageURL||j?.nowPlaying?.image||j?.data?.artwork||j?.data?.artworkURL;
   if(titulo && titulo.length>2){mus.innerText=titulo; }
   if(imagem){capa.src=imagem;capa.classList.add('on');}
   if(titulo) break;
  }catch(e){}
 }
}
setInterval(busca,5000);
busca();
</script>
</body>
</html>
