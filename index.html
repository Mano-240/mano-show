<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Web Rádio Mano Show</title>
<script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.0/lame.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1e4fff;color:#fff;font-family:Arial;text-align:center;padding-bottom:120px}
.capa{width:94%;max-width:420px;margin:15px auto;background:#000;border-radius:30px;overflow:hidden;height:420px;display:flex;align-items:center;justify-content:center}
.capa img{width:100%;height:100%;object-fit:cover;display:block}
.barra{background:#fff;color:#000;border-radius:50px;padding:14px 18px;margin:15px auto;width:94%;max-width:420px;display:flex;align-items:center;gap:12px;text-align:left;overflow:hidden}
.player{display:flex;align-items:center;gap:12px;width:94%;max-width:420px;margin:18px auto}
.btn-ouvir{flex:1;background:#1438ff;border:2px solid #2a4bff;color:#fff;font-size:32px;font-weight:900;padding:20px;border-radius:35px;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer}
.btn-rec{width:85px;height:85px;background:#ff0000;border-radius:50%;border:4px solid #fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer}
.btn-rec.gravando{animation:piscar 1s infinite;background:#fff;border-color:#ff0000}
.btn-rec.gravando div{background:#ff0000!important}
@keyframes piscar{0%,100%{opacity:1}50%{opacity:.6}}
.menu-bar{position:fixed;bottom:0;left:0;width:100%;background:#1e4fff;padding:10px 5px 22px;display:flex;justify-content:space-around;border-top:1px solid rgba(255,255,255,.15);z-index:900}
.item{color:#fff;text-decoration:none;font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:6px;width:16%}
.ico{width:58px;height:58px;background:#0d2fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900;border:2px solid rgba(255,255,255,.25)}
#side{position:fixed;top:0;right:-300px;width:280px;height:100%;background:#0a1fff;z-index:999;padding:25px;text-align:left;transition:.35s}
#side.aberto{right:0}
#side a{color:#fff;text-decoration:none;display:block;padding:15px 0;border-bottom:1px solid rgba(255,255,255,.15);font-size:15px}
.fundo{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.6);z-index:998;display:none}
.fundo.show{display:block}
</style>
</head>
<body>
<div class="capa"><img id="capa" src="./logo.png"></div>
<div class="barra"><div style="font-size:30px">🎵</div><div style="flex:1;overflow:hidden"><div style="font-size:12px;opacity:.6">Tocando agora</div><b id="musica" style="font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Web Rádio Mano Show - Ao Vivo</b></div></div>
<div class="player">
<button class="btn-ouvir" id="play">▶️ OUVIR</button>
<div class="btn-rec" id="rec" onclick="gravarMP3()"><div style="width:30px;height:30px;background:#fff;border-radius:50%"></div></div>
</div>
<div id="statusRec" style="font-size:12px;display:none">🔴 Gravando... clique pra salvar</div>
<div id="statusConv" style="font-size:12px;display:none">⏳ Convertendo pra MP3...</div>
<div class="menu-bar">
<a class="item" href="https://wa.me/5547991452690" target="_blank"><div class="ico">W</div>WhatsApp</a>
<a class="item" href="https://www.facebook.com/share/18wbZj1F72/" target="_blank"><div class="ico">f</div>Facebook</a>
<a class="item" href="https://www.instagram.com/manoshow.oficial" target="_blank"><div class="ico">◎</div>Instagram</a>
<a class="item" href="https://www.tiktok.com/@manoshowwebradio" target="_blank"><div class="ico">♪</div>TikTok</a>
<a class="item" href="https://youtube.com/@webradiomanoshow" target="_blank"><div class="ico">▶</div>YouTube</a>
<a class="item" href="#" onclick="abrirMenu()"><div class="ico">☰</div>Menu</a>
</div>
<div class="fundo" id="fundo" onclick="fecharMenu()"></div>
<div id="side">
<h2>☰ Menu</h2>
<a href="#" onclick="fecharMenu()">🏠 Início</a>
<a href="https://wa.me/5547991452690">💬 WhatsApp</a>
<a href="https://youtube.com/@webradiomanoshow">▶️ YouTube</a>
<a href="mailto:webradiomanoshow@gmail.com">✉️ E-mail</a>
<button onclick="fecharMenu()" style="margin-top:25px;background:transparent;border:1px solid #fff;color:#fff;padding:12px;border-radius:20px;width:100%">FECHAR</button>
</div>
<audio id="radio" src="https://stream.zeno.fm/0ctt516rnhovv" crossorigin="anonymous" preload="auto" playsinline></audio>
<script>
function abrirMenu(){document.getElementById('side').classList.add('aberto');document.getElementById('fundo').classList.add('show')}
function fecharMenu(){document.getElementById('side').classList.remove('aberto');document.getElementById('fundo').classList.remove('show')}
const LOGO="./logo.png", r=document.getElementById('radio'), b=document.getElementById('play'), t=document.getElementById('musica'), c=document.getElementById('capa');
b.onclick=async()=>{ if(r.paused){await r.play(); b.innerHTML="⏸️ PAUSAR";} else{r.pause(); b.innerHTML="▶️ OUVIR"} };
async function up(){
  try{
    let res=await fetch('https://zenoplay.zenomedia.com/api/zenofm/now-playing/0ctt516rnhovv?t='+Date.now());
    let j=await res.json();
    let d=j.data||j;
    let nome=d.title||j.title||"";
    let capaImg=d.image||j.image||"";
    if(nome && nome.length>1){ t.textContent=nome; }
    if(capaImg && capaImg.length>10){ c.src=capaImg; }
    else{ if(!c.src.includes('logo.png')) c.src=LOGO; }
    c.style.objectFit="cover";
  }catch(e){}
}
setInterval(up,4000); up();
let mediaRecorder, chunks=[], gravando=false;
async function gravarMP3(){
  if(!gravando){
    if(r.paused){alert("Dá play primeiro!");return}
    try{
      let stream=r.captureStream? r.captureStream() : r.mozCaptureStream();
      mediaRecorder=new MediaRecorder(stream); chunks=[];
      mediaRecorder.ondataavailable=e=>{ if(e.data.size>0) chunks.push(e.data) };
      mediaRecorder.onstop=async()=>{
        document.getElementById('statusRec').style.display='none';
        document.getElementById('statusConv').style.display='block';
        try{
          let blob=new Blob(chunks,{type:'audio/webm'}); let arrayBuffer=await blob.arrayBuffer();
          let ctx=new (window.AudioContext||window.webkitAudioContext)(); let audioBuffer=await ctx.decodeAudioData(arrayBuffer);
          let encoder=new lamejs.Mp3Encoder(2,audioBuffer.sampleRate,128);
          let left=audioBuffer.getChannelData(0); let right=audioBuffer.numberOfChannels>1? audioBuffer.getChannelData(1):left;
          let l16=new Int16Array(left.length), r16=new Int16Array(right.length);
          for(let i=0;i<left.length;i++){ l16[i]=left[i]*32767; r16[i]=right[i]*32767; }
          let mp3Data=[]; let buf=encoder.encodeBuffer(l16,r16); if(buf.length>0) mp3Data.push(buf); buf=encoder.flush(); if(buf.length>0) mp3Data.push(buf);
          let mp3Blob=new Blob(mp3Data,{type:'audio/mp3'}); let url=URL.createObjectURL(mp3Blob);
          let a=document.createElement('a'); a.href=url; a.download='Mano-Show-'+new Date().toISOString().slice(0,19).replace(/:/g,'-')+'.mp3'; a.click(); ctx.close();
        }catch(err){
          let blob2=new Blob(chunks,{type:'audio/webm'}); let url2=URL.createObjectURL(blob2);
          let a2=document.createElement('a'); a2.href=url2; a2.download='Mano-Show-'+Date.now()+'.mp3'; a2.click();
        }
        document.getElementById('statusConv').style.display='none';
      };
      mediaRecorder.start(100); gravando=true;
      document.getElementById('rec').classList.add('gravando'); document.getElementById('statusRec').style.display='block';
    }catch(e){alert("Navegador não permite gravar")}
  }else{ mediaRecorder.stop(); gravando=false; document.getElementById('rec').classList.remove('gravando'); }
}
</script>
</body>
</html>
