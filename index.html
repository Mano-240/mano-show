<div class="badge">● AO VIVO BLUMENAU SC</div><h2 style="font-weight:900;margin:6px 0 10px">WEB RADIO MANO SHOW</h2>
<div class="capa"><img src="logo.png" onerror="this.src='https://i.postimg.cc/sxcczN96/logo.webp'"></div>
<div class="tocando"><div style="width:44px;height:44px;background:#ffffff40;border-radius:50%;display:flex;align-items:center;justify-content:center">♫</div><div><div style="font-size:11px;opacity:.8">Tocando agora</div><div id="musica">MANO SHOW - AO VIVO</div></div></div>
<div class="player"><button class="btnPlay" id="playBtn" onclick="tocar()">|| PAUSAR</button><div class="rec" id="recBtn" onclick="gravar()"><div style="width:16px;height:16px;background:#fff;border-radius:50%" id="recDot"></div></div></div>

<audio id="radio" crossorigin="anonymous" src="https://stream-175.zeno.fm/0ctt516rnhovv"></audio>
<script>
const audio=document.getElementById('radio'),btn=document.getElementById('playBtn'),musica=document.getElementById('musica');
let on=true;audio.play().catch(()=>{on=false;btn.innerHTML='▶ TOCAR'});
function tocar(){if(!on){audio.play();btn.innerHTML='|| PAUSAR';on=true}else{audio.pause();btn.innerHTML='▶ TOCAR';on=false}}
// PEGA NOME IGUAL NA SUA FOTO
async function pegaMusica(){
  try{
    let url='https://api.allorigins.win/raw?url='+encodeURIComponent('https://api.zeno.fm/mounts/metadata/0ctt516rnhovv?'+Date.now());
    let r=await fetch(url);let j=await r.json();
    console.log(j);
    if(j.title && j.title!='' && j.title.toLowerCase().indexOf('mano show')==-1){
      musica.innerText=j.title; return;
    }
  }catch(e){console.log(e)}
}
setInterval(pegaMusica,3000);pegaMusica();
let gravando=false,recorder,chunks=[];
async function gravar(){
 if(!gravando){
  try{
   const stream=audio.captureStream ? audio.captureStream() : audio.mozCaptureStream();
   recorder=new MediaRecorder(stream);chunks=[];
   recorder.ondataavailable=e=>chunks.push(e.data);
   recorder.onstop=()=>{let blob=new Blob(chunks,{type:'audio/webm'});let u=URL.createObjectURL(blob);let a=document.createElement('a');a.href=u;a.download='mano-show-'+Date.now()+'.webm';a.click();};
   recorder.start();gravando=true;document.getElementById('recDot').style.borderRadius='2px';alert('Gravando... clica de novo no REC pra parar e baixar!');
  }catch(e){alert('No celular não grava por causa da Zeno, mas no Chrome do PC grava!');}
 }else{recorder.stop();gravando=false;document.getElementById('recDot').style.borderRadius='50%';}
}
</script></body></html>
