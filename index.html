<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MANO Web Rádio</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1570ff;color:#fff;font-family:Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:12px 12px 110px 12px}
.capa{width:100%;max-width:380px;border-radius:24px;overflow:hidden;aspect-ratio:1/1;background:#0d5ed8}
.capa img{width:100%;height:100%;object-fit:cover;display:block}
.tocando{background:#d0e3ff;width:100%;max-width:380px;margin-top:16px;border-radius:50px;padding:8px 16px;display:flex;align-items:center;gap:12px;color:#0d2a5e}
.tocando b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;font-weight:900}
#btnPlay{flex:1;background:#0e6eff;border:0;color:#fff;font-size:28px;font-weight:900;padding:22px 10px;border-radius:22px}
.play-line{width:100%;max-width:380px;margin-top:22px;display:flex;gap:14px;align-items:center}
.bottom{position:fixed;left:0;right:0;bottom:0;background:#1570ff;display:flex;justify-content:space-around;padding:10px 2px 12px 2px}
.b-item{display:flex;flex-direction:column;align-items:center;gap:5px;text-decoration:none;color:#fff;font-size:11px;font-weight:700;flex:1;border:0;background:none}
.b-item.cir{width:58px;height:58px;background:#0d5ed8;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px}
#menuOverlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:20;align-items:center;justify-content:center;padding:16px}
#menuBox{background:#fff;color:#222;width:100%;max-width:380px;border-radius:20px;padding:20px}
</style>
</head>
<body>
<div class="capa"><img id="capaMusica" src="logo.png" alt="Capa"></div>
<div class="tocando"><div style="width:48px;height:48px;background:#a9c9ff;border-radius:50%;display:flex;align-items:center;justify-content:center">🎵</div><div style="overflow:hidden;flex:1"><span style="font-size:13px;opacity:.7">Tocando agora</span><b id="musica">Carregando...</b></div></div>
<div class="play-line"><button id="btnPlay">II PAUSAR</button><div style="width:88px;height:88px;background:#ff1313;border:4px solid #fff;border-radius:50%;display:flex;align-items:center;justify-content:center"><span style="width:26px;height:26px;background:#fff;border-radius:50%;display:block"></span></div></div>
<audio id="radio" src="https://stream.zeno.fm/0ctt516rnhovv"></audio>
<div class="bottom">
<a class="b-item" href="https://wa.me/554791452690" target="_blank"><div class="cir">W</div>Whats</a>
<a class="b-item" href="https://www.facebook.com/share/194uCTvuQC/" target="_blank"><div class="cir">f</div>Face</a>
<a class="b-item" href="https://www.instagram.com/manoshow.oficial" target="_blank"><div class="cir">◎</div>Insta</a>
<a class="b-item" href="https://www.tiktok.com/@manoshowwebradio" target="_blank"><div class="cir">♪</div>TikTok</a>
<a class="b-item" href="https://youtube.com/@webradiomanoshow" target="_blank"><div class="cir">▶</div>You</a>
<button class="b-item" onclick="document.getElementById('menuOverlay').style.display='flex'"><div class="cir">☰</div>Menu</button>
</div>
<div id="menuOverlay" onclick="if(event.target==this)this.style.display='none'"><div id="menuBox"><h2 style="color:#1570ff">MANO Web Rádio</h2><a href="mailto:manoshowwebradio@gmail.com" style="display:block;background:#1570ff;color:#fff;padding:12px;border-radius:12px;text-align:center;text-decoration:none;margin-top:10px;font-weight:800">📧 manoshowwebradio@gmail.com</a><button style="margin-top:12px;width:100%;padding:12px;border:0;background:#ddd;border-radius:12px;font-weight:800" onclick="document.getElementById('menuOverlay').style.display='none'">Fechar</button></div></div>
<script>
const radio=document.getElementById('radio'),btnPlay=document.getElementById('btnPlay'),capa=document.getElementById('capaMusica'),musica=document.getElementById('musica');
let tocando=true;radio.play().catch(()=>{tocando=false;btnPlay.textContent='▶ OUVIR'});
btnPlay.onclick=async()=>{if(tocando){radio.pause();btnPlay.textContent='▶ OUVIR';tocando=false}else{await radio.play();btnPlay.textContent='II PAUSAR';tocando=true}};
capa.onerror=function(){this.src='logo.png';};
let ultima='';
async function pegaMusica(){
 try{
  let r=await fetch('https://zenoplay.zenomedia.com/api/zenofm/nowplaying/0ctt516rnhovv?t='+Date.now());
  let j=await r.json();
  if(j.title && j.title!==ultima){
   ultima=j.title;
   musica.textContent=j.title;
   // SÓ USA CAPA DA ZENO, SE NÃO TIVER USA SUA LOGO
   if(j.image && j.image.length>10) capa.src=j.image;
   else capa.src='logo.png';
  }
 }catch(e){}
}
pegaMusica();setInterval(pegaMusica,8000);
</script>
</body>
</html>
