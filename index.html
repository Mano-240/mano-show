<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WEB RADIO MANO SHOW</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial, sans-serif}
body{background:#1a4fc4;color:#fff;text-align:center;padding:15px;min-height:100vh}
.logo{font-weight:bold;letter-spacing:1px;margin:15px 0;font-size:20px}
.capa{width:95%;max-width:380px;background:#000;border-radius:20px;padding:10px;margin:15px auto}
.capa img{width:100%;border-radius:15px;display:block}
.now{background:rgba(255,255,255,0.15);border-radius:30px;padding:12px 15px;display:flex;align-items:center;gap:12px;margin:20px auto;max-width:380px;text-align:left}
.btn-pause{background:#2196f3;color:#fff;border:none;width:70%;max-width:300px;padding:18px;border-radius:30px;font-size:20px;font-weight:bold;margin:20px 0}
.footer{display:flex;justify-content:center;gap:15px;flex-wrap:wrap;margin-top:30px;max-width:400px;margin-left:auto;margin-right:auto}
.item{display:flex;flex-direction:column;align-items:center;text-decoration:none;color:#fff;cursor:pointer}
.circle{width:62px;height:62px;background:#2196f3;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px}
.label{font-size:12px;margin-top:6px}
</style>
</head>
<body>

<div class="logo">WEB RADIO MANO SHOW</div>

<div class="capa">
<img src="https://i.imgur.com/8Km9tLL.jpg" alt="Raul Seixas">
</div>

<div class="now">
<div style="width:45px;height:45px;background:rgba(0,0,0,0.3);border-radius:50%;display:flex;align-items:center;justify-content:center">🎵</div>
<div><small>Tocando agora</small><br><b>Raul Seixas</b></div>
</div>

<button class="btn-pause">|| PAUSAR</button>

<!-- BOTOES NO FINAL -->
<div class="footer">
<a class="item" href="https://wa.me/" target="_blank"><div class="circle">W</div><div class="label">Whats</div></a>
<a class="item" href="#" target="_blank"><div class="circle">f</div><div class="label">Face</div></a>
<a class="item" href="#" target="_blank"><div class="circle">◎</div><div class="label">Insta</div></a>
<a class="item" href="#" target="_blank"><div class="circle">♪</div><div class="label">TikTok</div></a>
<a class="item" href="https://youtube.com/@manoshow" target="_blank"><div class="circle">▶</div><div class="label">YouTube</div></a>
<div class="item" onclick="document.getElementById('menuEmail').style.display='flex'"><div class="circle">☰</div><div class="label">Menu</div></div>
</div>

<!-- MENU QUE ABRE COM EMAIL ESCRITO EM CIMA -->
<div id="menuEmail" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.96);z-index:9999;flex-direction:column;align-items:center;justify-content:center;padding:20px">
<button onclick="document.getElementById('menuEmail').style.display='none'" style="position:absolute;top:20px;right:20px;background:none;border:none;color:#fff;font-size:32px">X</button>

<p style="color:#888;font-size:14px;letter-spacing:4px;margin-bottom:10px">EMAIL</p>
<p style="color:#fff;font-size:22px;font-weight:bold;background:#2196f3;padding:20px 25px;border-radius:15px;word-break:break-all">manoshowwebradio@gmail.com</p>
<a href="mailto:manoshowwebradio@gmail.com" style="background:#e50914;color:#fff;padding:15px 30px;border-radius:30px;text-decoration:none;font-weight:bold;margin-top:25px">ENVIAR E-MAIL</a>
</div>

</body>
</html>
