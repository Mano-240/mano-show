<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Web Rádio Mano Show</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#1a4bff;color:white;font-family:Arial;text-align:center;padding-bottom:20px}
.capa{width:92%;height:400px;margin:8px auto;border-radius:35px;overflow:hidden;background:#000;border:3px solid rgba(255,255,255,0.2)}
.capa img{width:100%;height:100%;object-fit:cover}
.tocando{background:white;color:#000;border-radius:50px;padding:14px 22px;margin:15px;display:flex;align-items:center;gap:12px;text-align:left}
.tocando b{font-size:16px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:250px}
.player-area{display:flex;align-items:center;justify-content:center;gap:20px;margin:25px 0}
.btn-ouvir{background:#2245f0;border:3px solid rgba(255,255,255,0.3);color:#fff;font-size:34px;font-weight:900;padding:18px 50px;border-radius:35px;cursor:pointer}
.btn-record{width:95px;height:95px;background:red;border-radius:50%;border:5px solid #fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
.btn-record span{width:38px;height:38px;background:#fff;border-radius:50%;display:block;animation:pulse 1.2s infinite}
.btn-record.gravando{background:#fff;animation:pisca.6s infinite}
.btn-record.gravando span{background:red;border-radius:5px;width:30px;height:30px;animation:none}
@keyframes pulse{0%{transform:scale(.9)}50%{transform:scale(1.2)}100%{transform:scale(.9)}}
@keyframes pisca{0%{opacity:1}50%{opacity:.5}100%{opacity:1}}
.menu-bottom{display:flex;justify-content:space-around;margin-top:25px}
.item-menu{display:flex;flex-direction:column;align-items:center;text-decoration:none;color:#fff;font-size:11px;font-weight:bold}
.item-menu.icon{width:62px;height:62px;background:#2245f0;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;margin-bottom:5px;border:2px solid rgba(255,255,255,.15)}
#menuLateral{position:fixed;top:0;right:-110%;width:85%;max-width:340px;height:100%;background:#0a2bb5;z-index:99999;transition:.4s;padding:25px;text-align:left}
#menuLateral a{color:#fff;display:block;margin:22px 0;text-decoration:none;font-size:18px;border-bottom:1px solid rgba(255,255,255,.1);padding-bottom:12px}
</style>
</head>
<body>
<div class="capa"><img id="capaMusica" src="https://via.placeholder.com/600x600/0d3bd1/ffffff?text=MANO+SHOW" alt="Capa"></div>
<div class="tocando"><div style="font-size:36px">🎵</div><div style="overflow:hidden"><div style="font-size:13px;opacity:.7">Tocando agora</div><b id="musicaAtual">Web Rádio Mano Show - Ao Vivo</b></div></div>
<div class="player-area">
<button class="btn-ouvir" id="btnPlay">▶️ OUVIR</button>
<div class="btn-record" id="btnRecord"><span></span></div>
</div>
<audio id="radio" crossorigin="anonymous" src="https://stream-150.zeno.fm/nw2p96u0a2zuv?zs=Q_BXbF0LQO-RpZJz3d2u2g"></audio>
<div class="menu-bottom">
<a class="item-menu" href="https://wa.me/5547991452690"><div class="icon">W</div>WhatsApp</a>
<a class="item-menu" href="https://www.facebook.com/share/18wbZj1F72/" target="_blank"><div class="icon">f</div>Facebook</a>
<a class="item-menu" href="https://www.instagram.com/manoshow.oficial" target="_blank"><div class="icon">◎</div>Instagram</a>
<a class="item-menu" href="#"><div class="icon">♪</div>TikTok</a>
<a class="item-menu" href="#"><div class="icon">▶️</div>YouTube</a>
<a class="item-menu" href="#" id="btnMenu"><div class="icon">≡</div>Menu</a>
</div>
<div id="menuLateral">
<div style="font-size:26px;text-align:right;cursor:pointer" onclick="fecharMenu()">✕ FECHAR</div>
<h2 style="border-bottom:2px solid #fff;padding-bottom:12px">Menu Mano Show</h2>
<a href="https://wa.me/5547991452690">📱 WhatsApp</a>
<a href="mailto:manoshowwebradio@gmail.com">📧 manoshowwebradio@gmail.com</a>
<a href="https://www.facebook.com/share/18wbZj1F72/" target="_blank">📘 Facebook</a>
<a href="https://www.instagram.com/manoshow.oficial" target="_blank">📸 Instagram</a>
<a href="#" onclick="fecharMenu()">🏠 Voltar</a>
</div>
<script>
const LOGO="https://via.placeholder.com/600x600/0d3bd1/ffffff?text=MANO+SHOW+WEB+RADIO";
const radio=document.getElementById('radio');
const capa=document.getElementById('capaMusica');
const titulo=document.getElementById('musicaAtual');
const btnPlay=document.getElementById('btnPlay');
const btnRec=document.getElementById('btnRecord');
let gravando=false,recorder,chunks=[];
btnPlay.onclick=async()=>{if(radio.paused){await radio.play();btnPlay.innerHTML="⏸️ PAUSAR";}else{radio.pause();btnPlay.innerHTML="▶️ OUVIR";}};
function abrirMenu(){document.getElementById('menuLateral').style.right='0'}
function fecharMenu(){document.getElementById('menuLateral').style.right='-110%'}
document.getElementById('btnMenu').onclick=(e)=>{e.preventDefault();abrirMenu()};
capa.onerror=()=>{capa.src=LOGO};
btnRec.onclick=async()=>{
 if(!gravando){
  if(radio.paused){alert("Dê PLAY primeiro!");return;}
  try{
   const stream=radio.captureStream?radio.captureStream():radio.mozCaptureStream();
   recorder=new MediaRecorder(stream);chunks=[];
   recorder.ondataavailable=e=>{if(e.data.size>0)chunks.push(e.data)};
   recorder.onstop=()=>{
    const blob=new Blob(chunks,{type:'audio/mp3'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download='ManoShow-'+Date.now()+'.mp3';a.click();
   };
   recorder.start();gravando=true;btnRec.classList.add('gravando');
  }catch(e){alert("Use Google Chrome para gravar");}
 }else{recorder.stop();gravando=false;btnRec.classList.remove('gravando');}
};
async function buscaCapa(nome){
 try{let r=await fetch('https://itunes.apple.com/search?term='+encodeURIComponent(nome)+'&limit=1&media=music');let j=await r.json();if(j.results.length>0){capa.src=j.results[0].artworkUrl100.replace('100x100bb','600x600bb');}else{capa.src=LOGO;}}catch{ capa.src=LOGO; }
}
async function aoVivo(){
 try{let r=await fetch('https://zenoplay.zenomedia.com/api/zenofm/now/playing/nw2p96u0a2zuv');let j=await r.json();if(j&&j.title){titulo.innerText=j.title;buscaCapa(j.title);}}catch{}
}
aoVivo();setInterval(aoVivo,15000);
</script>
</body>
</html>
