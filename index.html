<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Web Rádio Mano Show</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f0f0f;color:#fff;font-family:Arial,sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}
.card{background:#1a1a1a;border-radius:20px;padding:25px;max-width:400px;width:100%;text-align:center;border:1px solid #333}
.logo{width:150px;height:150px;border-radius:50%;margin:0 auto 20px;background:#222;display:flex;align-items:center;justify-content:center;font-size:50px;overflow:hidden}
.logo.playing{animation:spin 3s linear infinite}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
h1{font-size:24px;color:#00d4ff}
.sub{color:#888;font-size:14px;margin-bottom:15px}
.now{background:#222;border-radius:12px;padding:12px;margin:15px 0;min-height:55px}
.now small{color:#00d4ff;font-size:11px;text-transform:uppercase}
#track{font-size:16px;font-weight:bold;margin-top:4px}
.play-btn{width:80px;height:80px;border-radius:50%;border:none;background:#00d4ff;color:#000;font-size:35px;cursor:pointer;margin:15px auto;display:flex;align-items:center;justify-content:center}
</style>
</head>
<body>
<div class="card">
<div class="logo" id="logo">🎧</div>
<h1>MANO SHOW</h1>
<p class="sub">Ao Vivo 24h ● AO VIVO</p>
<div class="now">
<small>🎵 Tocando agora</small>
<div id="track">Carregando música...</div>
</div>
<button class="play-btn" id="playBtn">▶</button>
<audio id="audio"></audio>
</div>
<script>
const STREAM_URL = "https://stream.zeno.fm/0ctt516rnhovv";
const METADATA_URL = "https://api.zeno.fm/mounts/metadata/subscribe/0ctt516rnhovv";
const audio = document.getElementById('audio');
const playBtn = document.getElementById('playBtn');
const trackEl = document.getElementById('track');
const logo = document.getElementById('logo');
let isPlaying = false;
audio.src = STREAM_URL;
playBtn.onclick = () => {
  if(!isPlaying){
    audio.play().then(()=>{isPlaying=true;playBtn.textContent="⏸";logo.classList.add('playing');});
  }else{audio.pause();isPlaying=false;playBtn.textContent="▶";logo.classList.remove('playing');}
};
function connectMetadata(){
  const es = new EventSource(METADATA_URL);
  es.onmessage = (event)=>{
    try{
      const data = JSON.parse(event.data);
      if(data.streamTitle){trackEl.textContent=data.streamTitle;document.title=data.streamTitle+" - Mano Show";}
    }catch(e){}
  };
  es.onerror = ()=>{es.close();setTimeout(connectMetadata,5000);};
}
connectMetadata();
</script>
</body>
</html>
