<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mano Show</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#1e4fff;color:#fff;font-family:Arial;text-align:center;padding-bottom:120px}
.capa{width:94%;max-width:420px;margin:12px auto;background:#000;border-radius:30px;height:420px;overflow:hidden}
.capa img{width:100%;height:100%;object-fit:cover}
.barra{background:#fff;color:#000;border-radius:50px;padding:14px;margin:12px auto;width:94%;max-width:420px;display:flex;gap:10px;text-align:left;align-items:center}
.player{display:flex;gap:10px;width:94%;max-width:420px;margin:15px auto}
.btn{flex:1;background:#1438ff;border:2px solid #2a4bff;color:#fff;font-size:28px;font-weight:900;padding:18px;border-radius:30px}
.menu{position:fixed;bottom:0;left:0;width:100%;background:#1e4fff;padding:10px 0 20px;display:flex;justify-content:space-around}
.item{color:#fff;text-decoration:none;font-size:10px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:5px;width:16%}
.ico{width:50px;height:50px;background:#0d2fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;border:2px solid rgba(255,255,255,.3)}
</style>
</head>
<body>
<div class="capa"><img id="capa" src="./logo.png"></div>
<div class="barra"><div>🎵</div><div><div style="font-size:10px;opacity:.6">Tocando agora</div><b id="nome" style="font-size:14px">Mano Show Ao Vivo</b></div></div>
<div class="player"><button class="btn" id="play">▶️ OUVIR</button></div>

<a class="item" href="https://www.facebook.com/share/18wbZj1F72/"><div class="ico">f</div>Face</a>
<a class="item" href="https://www.instagram.com/manoshow.oficial"><div class="ico">◎</div>Insta</a>
<a class="item" href="https://www.tiktok.com/@manoshowwebradio"><div class="ico">♪</div>TikTok</a>
<a class="item" href="https://youtube.com/@webradiomanoshow"><div class="ico">▶</div>YouTube</a>
<a class="item" href="#"><div class="ico">☰</div>Menu</a>
</div>
<audio id="radio" src="https://stream.zeno.fm/0ctt516rnhovv" preload="none"></audio>
<script>
const r=document.getElementById('radio'), b=document.getElementById('play'), n=document.getElementById('nome'), capa=document.getElementById('capa');
b.onclick=async()=>{if(r.paused){await r.play();b.textContent='⏸️ PAUSAR'}else{r.pause();b.textContent='▶️ OUVIR'}};
async function busca(){
 try{
  // Tenta 1: API Zeno com proxy 1
  let u = 'https://api.allorigins.win/get?url='+encodeURIComponent('https://zenoplay.zenomedia.com/api/zenofm/now-playing/0ctt516rnhovv');
  let res = await fetch(u); let data = await res.json(); let j = JSON.parse(data.contents);
  console.log(j);
  if(j.title){ n.textContent=j.title; if(j.image) capa.src=j.image; return; }
 }catch(e){}
 try{
  // Tenta 2: Proxy 2
  let u2 = 'https://corsproxy.io/?'+encodeURIComponent('https://zenoplay.zenomedia.com/api/zenofm/now-playing/0ctt516rnhovv');
  let res2 = await fetch(u2); let j2 = await res2.json();
  if(j2.title){ n.textContent=j2.title; if(j2.image) capa.src=j2.image; return; }
 }catch(e){}
}
setInterval(busca,5000);
busca();
</script>
