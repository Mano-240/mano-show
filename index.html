<audio id="radio" src="https://stream.zeno.fm/0ctt516rnhovv" preload="none" crossorigin="anonymous"></audio>
<script>
const r=document.getElementById('radio'), b=document.getElementById('play'), g=document.getElementById('gravar'), recTag=document.getElementById('REC');
let audioCtx, source, processor, mp3Encoder, mp3Chunks=[], gravando=false;

b.onclick=async()=>{
 if(r.paused){ await r.play(); b.textContent='⏸️ PAUSAR'; }
 else{ r.pause(); b.textContent='▶️ OUVIR'; }
};

g.onclick=async()=>{
 if(!gravando){
  if(r.paused){ alert('Clica em OUVIR primeiro!'); return; }
  // cria contexto só 1 vez
  if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended') await audioCtx.resume();
  if(!source){
   source = audioCtx.createMediaElementSource(r);
   source.connect(audioCtx.destination); // mantém tocando SEMPRE
  }
  mp3Encoder = new lamejs.Mp3Encoder(1, audioCtx.sampleRate, 128);
  mp3Chunks=[];
  processor = audioCtx.createScriptProcessor(4096,1,1);
  processor.onaudioprocess=(e)=>{
    let data = e.inputBuffer.getChannelData(0);
    let int16 = new Int16Array(data.length);
    for(let i=0;i<data.length;i++) int16[i]=Math.max(-1,Math.min(1,data[i]))*32767;
    let mp3 = mp3Encoder.encodeBuffer(int16);
    if(mp3.length>0) mp3Chunks.push(mp3);
  };
  source.connect(processor);
  processor.connect(audioCtx.destination);
  gravando=true; g.textContent='⏹️ PARAR'; recTag.style.display='block';
 }else{
  try{
   processor.disconnect();
   let final = mp3Encoder.flush();
   if(final.length>0) mp3Chunks.push(final);
   if(mp3Chunks.length>0){
    let blob = new Blob(mp3Chunks,{type:'audio/mp3'});
    let url = URL.createObjectURL(blob);
    let a=document.createElement('a');
    a.href=url; a.download='mano-show-'+Date.now()+'.mp3';
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ document.body.removeChild(a); URL.revokeObjectURL(url); },1000);
   }else{ alert('Gravação vazia, tente de novo com volume alto'); }
  }catch(e){ alert('Erro ao salvar: '+e.message); }
  gravando=false; g.textContent='⏺️ GRAVAR'; recTag.style.display='none';
  mp3Chunks=[];
 }
};

// capa e nome
async function busca(){
 try{
  let u='https://api.allorigins.win/raw?url='+encodeURIComponent('https://zenoplay.zenomedia.com/api/zenofm/now-playing/0ctt516rnhovv');
  let res=await fetch(u); let j=await res.json();
  if(j.title){ document.getElementById('nome').textContent=j.title; document.getElementById('artista').textContent=j.artist||''; }
  if(j.image) document.getElementById('capa').src=j.image;
 }catch(e){}
}
setInterval(busca,8000); busca();
</script>
