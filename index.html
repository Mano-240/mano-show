<script>
const radio=document.getElementById('radio');
const btn=document.getElementById('btnPlay');
const titulo=document.getElementById('titulo');
const capa=document.getElementById('capaImg');
let tocando=false;
btn.onclick=async()=>{
 try{
  if(!tocando){await radio.play();btn.textContent='II PAUSAR';tocando=true}
  else{radio.pause();btn.textContent='▶ OUVIR';tocando=false}
 }catch(e){alert('Toque novamente para liberar o áudio')}
};

async function buscaCapa(nome){
 try{
  const r=await fetch('https://itunes.apple.com/search?term='+encodeURIComponent(nome)+'&limit=1&media=music');
  const j=await r.json();
  if(j.results[0]) return j.results[0].artworkUrl100.replace('100x100','600x600');
 }catch(e){}
 return null;
}
async function atualizaZeno(){
 try{
  const r=await fetch('https://api.zeno.fm/mounts/metadata/subscribe/0r0xa7x8f2zuv?cb='+Date.now(),{cache:'no-store'});
  const t=await r.text();
  const m=t.match(/"streamTitle":"([^"]+)"/);
  if(m && m[1]){
   let nome=m[1].trim();
   if(nome && nome!=' - ' && nome.length>2){
    titulo.textContent=nome;
    const c=await buscaCapa(nome);
    if(c) capa.src=c;
    return;
   }
  }
 }catch(e){}
}
atualizaZeno();
setInterval(atualizaZeno,10000);
</script>
