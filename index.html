<script>
const r=document.getElementById('radio'), b=document.getElementById('play'), g=document.getElementById('gravar'), n=document.getElementById('nome'), art=document.getElementById('artista'), capa=document.getElementById('capa'), recTag=document.getElementById('REC');
let audioCtx, processor, mp3Encoder, mp3Data=[], gravando=false, source;
b.onclick=async()=>{if(r.paused){await r.play();b.textContent='⏸️ PAUSAR'}else{r.pause();b.textContent='▶️ OUVIR'}};
g.onclick=async()=>{
 if(!gravando){
  if(r.paused){ alert('Clica em OUVIR primeiro!'); return; }
  audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  source = audioCtx.createMediaElementSource(r);
  processor = audioCtx.createScriptProcessor(4096,2,2);
  mp3Encoder = new lamejs.Mp3Encoder(2, audioCtx.sampleRate, 128);
  mp3Data=[];
  processor.onaudioprocess = function(e){
    let left = e.inputBuffer.getChannelData(0);
    let right = e.inputBuffer.numberOfChannels>1? e.inputBuffer.getChannelData(1) : left;
    let l16 = new Int16Array(left.length); let r16 = new Int16Array(right.length);
    for(let i=0;i<left.length;i++){ l16[i]=left[i]*32767; r16[i]=right[i]*32767; }
    let mp3buf = mp3Encoder.encodeBuffer(l16,r16);
    if(mp3buf.length>0) mp3Data.push(mp3buf);
  };
  source.connect(processor); processor.connect(audioCtx.destination); source.connect(audioCtx.destination);
  gravando=true; g.textContent='⏹️ PARAR'; recTag.style.display='block';
 }else{
  let mp3buf = mp3Encoder.flush();
  if(mp3buf.length>0) mp3Data.push(mp3buf);
  let blob = new Blob(mp3Data, {type:'audio/mp3'});
  let url = URL.createObjectURL(blob);
  let a=document.createElement('a'); a.href=url; a.download='mano-show-'+Date.now()+'.mp3'; a.click();
  processor.disconnect(); source.disconnect(); audioCtx.close();
  gravando=false; g.textContent='⏺️ GRAVAR MP3'; recTag.style.display='none'; mp3Data=[];
 }
};
async function busca(){
 try{
  let u='https://api.allorigins.win/raw?url='+encodeURIComponent('https://zenoplay.zenomedia.com/api/zenofm/now-playing/0ctt516rnhovv');
  let res=await fetch(u); let j=await res.json();
  let titulo = j.title || j.song || j.now_playing?.song?.text || '';
  let artista = j.artist || j.now_playing?.song?.artist || '';
  let imagem = j.image || j.art || j.now_playing?.song?.art || '';
  if(titulo){ n.textContent=titulo; art.textContent=artista; }
  if(imagem){ capa.src=imagem; }
 }catch(e){}
}
setInterval(busca,8000); busca();
</script>
