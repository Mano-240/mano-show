  <button id="btnGravar" style="background:red; color:white; padding:15px 30px; border:none; border-radius:50px; font-weight:bold; font-size:16px;">🔴 GRAVAR MÚSICA</button>

</div>

<nav style="position:fixed; bottom:0; left:0; right:0; background:#111; display:flex; justify-content:space-around; align-items:center; padding:10px 2px; z-index:9999; border-top:2px solid #ff0000;">

</nav>

<script>
let gravador, partes=[], gravando=false;
const player=document.getElementById('player');
const btn=document.getElementById('btnGravar');
const status=document.getElementById('status');
btn.onclick=async()=>{
  if(!gravando){
    try{
      const stream=player.captureStream?player.captureStream():player.mozCaptureStream();
      gravador=new MediaRecorder(stream);
      partes=[];
      gravador.ondataavailable=e=>{if(e.data.size>0)partes.push(e.data);};
      gravador.onstop=()=>{
        const blob=new Blob(partes,{type:'audio/mpeg'});
        const url=URL.createObjectURL(blob);
        const a=document.createElement('a');
        a.href=url;
        a.download='ManoShow-Musica-'+Date.now()+'.mp3';
        a.click();
        status.innerText='✅ MÚSICA GRAVADA E SALVA NO CELULAR!';
      };
      gravador.start();
      gravando=true;
      btn.innerText='⏹️ PARAR E SALVAR';
      btn.style.background='#333';
      status.innerText='🔴 GRAVANDO A MÚSICA...';
    }catch(err){alert('Use Google Chrome no celular!');}
  }else{
    gravador.stop();
    gravando=false;
    btn.innerText='🔴 GRAVAR MÚSICA';
    btn.style.background='red';
  }
};
</script>
</body>
