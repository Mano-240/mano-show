*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#1e5bb5;min-height:100vh;color:#fff;display:flex;flex-direction:column;align-items:center;padding:12px}
.badge{background:#e30613;padding:6px 16px;border-radius:20px;font-size:12px;font-weight:900;margin:10px 0}
.capa{width:85%;max-width:320px;aspect-ratio:1;border-radius:18px;overflow:hidden;box-shadow:0 8px 20px #0006;margin:10px 0}

.tocando{background:#ffffff30;backdrop-filter:blur(10px);width:95%;max-width:380px;padding:12px 16px;border-radius:30px;display:flex;align-items:center;gap:12px;margin:12px 0}

.rec{width:64px;height:64px;background:#e30613;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative}
.rec::after{content:"REC";position:absolute;bottom:-18px;font-size:12px;font-weight:900;color:#ff6b6b}
.rec span{width:16px;height:16px;background:#fff;border-radius:50%}
.nav{width:100%;max-width:420px;display:flex;justify-content:space-around;margin-top:20px;padding-bottom:10px}
.nav a{color:#fff;text-decoration:none;font-size:10px;font-weight:bold;display:flex;flex-direction:column;align-items:center;gap:6px}
.nav .ico{width:52px;height:52px;background:#1877f2;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 4px 10px #0004}
#menuBtn{width:52px;height:52px;background:#1877f2;border-radius:50%;border:0;color:#fff;font-size:24px;font-weight:bold;box-shadow:0 4px 10px #0004;display:flex;flex-direction:column;align-items:center;justify-content:center}
.sheet{position:fixed;bottom:-100%;left:0;right:0;background:#fff;color:#222;padding:20px;border-radius:24px 24px 0 0;transition:.35s;z-index:30}
.sheet.on{bottom:0}
.ov{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);display:none;z-index:15}
.ov.on{display:block}
.item{display:flex;align-items:center;gap:12px;padding:14px;background:#f0f6ff;border-radius:12px;margin:8px 0;text-decoration:none;color:#333;font-size:14px;font-weight:bold}

<script>
const audio=document.getElementById('radio');const btn=document.getElementById('playBtn');let on=true;
audio.play().catch(()=>{on=false;btn.innerHTML='▶ TOCAR'});
function tocar(){if(!on){audio.play();btn.innerHTML='|| PAUSAR';on=true}else{audio.pause();btn.innerHTML='▶ TOCAR';on=false}}
function abreMenu(){document.getElementById('sheet').classList.add('on');document.getElementById('ov').classList.add('on')}
function fechaMenu(){document.getElementById('sheet').classList.remove('on');document.getElementById('ov').classList.remove('on')}

setInterval(pegaMusica,4000);pegaMusica();
