<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Web Rádio Mano Show</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#1440ff;color:white;font-family:Arial;text-align:center;padding-bottom:25px;overflow-x:hidden}
.capa{width:88%;max-width:400px;height:380px;margin:15px auto;border-radius:30px;overflow:hidden;background:#000;border:3px solid #fff;display:flex;align-items:center;justify-content:center}
.capa img{width:100%;height:100%;object-fit:cover}
.tocando{background:white;color:#000;border-radius:50px;padding:14px 18px;margin:12px auto;width:92%;max-width:400px;display:flex;align-items:center;gap:12px;text-align:left}
.tocando b{font-size:15px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:240px}
.player-area{display:flex;align-items:center;justify-content:center;gap:15px;margin:20px auto;width:92%}
.btn-ouvir{background:#0022cc;border:3px solid #fff;color:#fff;font-size:26px;font-weight:900;padding:16px 35px;border-radius:30px;cursor:pointer;flex:1;max-width:220px}
.btn-record{width:80px;height:80px;min-width:80px;background:red;border-radius:50%;border:4px solid #fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
.btn-record span{width:32px;height:32px;background:#fff;border-radius:50%;display:block;animation:pulse 1.2s infinite}
.btn-record.gravando{background:#fff}
.btn-record.gravando span{background:red;border-radius:4px;width:26px;height:26px;animation:none}
@keyframes pulse{0%{transform:scale(.9)}50%{transform:scale(1.2)}100%{transform:scale(.9)}}
.menu-bottom{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:20px;padding:0 10px}
.item-menu{display:flex;flex-direction:column;align-items:center;text-decoration:none;color:#fff;font-size:10px;font-weight:bold;width:62px}
.item-menu .icon{width:58px;height:58px;background:#001eb8;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;margin-bottom:5px;border:2px solid rgba(255,255,255,.2)}
#menuLateral{position:fixed;top:0;right:-110%;width:85%;max-width:340px;height:100%;background:#0a2bb5;z-index:99999;transition:.4s;padding:25px;text-align:left}
#menuLateral a{color:#fff;display:block;margin:20px 0;text-decoration:none;font-size:18px;border-bottom:1px solid rgba(255,255,255,.1);padding-bottom:10px}
</style>
</head>
<body>

<div class="capa"><img id="capaMusica" src="https://i.imgur.com/8Km9tLL.png" alt="Mano Show"></div>

<div class="tocando">
<div style="font-size:32px">🎵</div>
<div style="overflow:hidden"><div style="font-size:12px;opacity:.6">Tocando agora</div><b id="musicaAtual">Web Rádio Mano Show - Ao Vivo</b></div>
</div>

<div class="player-area">
<button class="btn-ouvir" id="btnPlay">▶️ OUVIR</button>
<div class="btn-record" id="btnRecord"><span></span></div>
</div>

<audio id="radio" crossorigin="anonymous" src="https://stream.zeno.fm/0ctt516rnhovv"></audio>

<div class="menu-bottom">
<a class="item-menu" href="https://wa.me/5547991452690"><div class="icon">W</div>WhatsApp</a>
<a class="item-menu" href="https://www.facebook.com/share/18wbZj1F72/"><div class="icon">f</div>Facebook</a>
<a class="item-menu" href="https://www.instagram.com/manoshow.oficial"><div class="icon">◎</div>Instagram</a>
<a class="item-menu" href="#"><div class="icon">♪</div>TikTok</a>
<a class="item-menu" href="#"><div class="icon">▶</div>YouTube</a>
<a class="item-menu" href="#" id="btnMenu"><div class="icon">≡</div>Menu</a>
</div>

<div id="menuLateral">
<div style="font-size:24px;text-align:right;cursor:pointer" onclick="fecharMenu()">✕ FECHAR</div>
<h2 style="border-bottom:2px solid #fff;padding-bottom:12px">Menu Mano Show</h2>
<a href="https://wa.me/5547991452690">📱 WhatsApp</a>
<a href="mailto:manoshowwebradio@gmail.com">📧 E-mail</a>
<a href="https://www.facebook.com/share/18wbZj1F72/">📘 Facebook</a>
<a href="https://www.instagram.com/manoshow.oficial">📸 Instagram</a>
<a href="#" onclick="fecharMenu()">🏠 Voltar ao Player</a>
</div>

<script>
const radio=document.getElementById('radio');
const btnPlay=document.getElementById('btnPlay');
const btnRec=document.getElementById('btnRecord');
let gravando=false,recorder,chunks=[];

btnPlay.onclick=async()=>{
 if(radio.paused){
  try{await radio.play();btnPlay.innerHTML="⏸️ PAUSAR";}catch(e){alert("Toque novamente em OUVIR");}
 }else{radio.pause();btnPlay.innerHTML="▶️ OUVIR";}
};

function abrirMenu(){document.getElementById('menuLateral').style.right='0'}
function fecharMenu(){document.getElementById('menuLateral').style.right='-110%'}
document.getElementById('btnMenu').onclick=(e)=>{e.preventDefault();abrirMenu()};

btnRec.onclick=async()=>{
 if(!gravando){
  if(radio.paused){alert("Dê PLAY no OUVIR primeiro!");return;}
  try{
   const stream=radio.captureStream?radio.captureStream():radio.mozCaptureStream();
   recorder=new MediaRecorder(stream);chunks=[];
   recorder.ondataavailable=e=>{if(e.data.size>0)chunks.push(e.data)};
   recorder.onstop=()=>{
    const blob=new Blob(chunks,{type:'audio/webm'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download='ManoShow-'+Date.now()+'.mp3';a.click();
   };
   recorder.start();gravando=true;btnRec.classList.add('gravando');
  }catch(e){alert("Gravação só funciona no Google Chrome");}
 }else{
  recorder.stop();gravando=false;btnRec.classList.remove('gravando');
 }
};
</script>
</body>
</html>
