<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0d6efd">
<title>MANO SHOW</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#0d6efd;color:#fff;font-family:Arial;text-align:center;min-height:100vh}
.top-img{width:92%;max-width:380px;margin:12px auto;display:block;border-radius:28px;aspect-ratio:1/1;object-fit:cover}
.now{width:92%;max-width:380px;margin:14px auto;background:#dbeafe;color:#1e3a8a;padding:10px 14px;border-radius:20px;display:flex;gap:10px;font-size:13px;font-weight:bold;text-align:left}
.controls{width:92%;max-width:380px;margin:18px auto;display:flex;gap:14px;align-items:center}
.btn-ouvir{flex:1;background:#1558d6;height:68px;border-radius:22px;border:none;color:#fff;font-size:22px;font-weight:900}
.btn-rec{width:78px;height:78px;background:red;border-radius:50%;border:4px solid #fff}
.btn-rec.gravando{animation:pulse 1s infinite}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.1)}100%{transform:scale(1)}}
.social{width:92%;max-width:380px;margin:20px auto;display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.social a{width:64px;height:64px;background:#1558d6;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;text-decoration:none;font-weight:900}
#playerGravacao{width:92%;max-width:380px;margin:12px auto;display:none}
</style>
</head>
<body>
<img class="top-img" src="logo.png" alt="MANO SHOW">
<div class="now">🎵 Tocando agora - Diego e Victor Hugo</div>
<div class="controls">
<button class="btn-ouvir" id="btnPlay">▶️ OUVIR</button>
<button class="btn-rec" id="btnRec" onclick="gravar()"></button>
</div>
<audio id="radio" preload="none" playsinline webkit-playsinline><source src="https://stream-175.zeno.fm/0ctt516rnhovv" type="audio/mpeg"></audio>
<audio id="playerGravacao" controls></audio>
<div id="info" style="font-size:12px"></div>
<div class="social">
<a href="https://wa.me/554791452690" target="_blank">W</a>
<a href="https://www.facebook.com/share/188ZhfgmJh/" target="_blank">f</a>
<a href="https://www.instagram.com/manoshow.oficial" target="_blank">IG</a>
<a href="https://www.tiktok.com/@manoshowwebradio" target="_blank">TK</a>
<a href="https://youtube.com/@webradiomanoshow" target="_blank">YT</a>
</div>
<script>
const radio=document.getElementById('radio'),btnPlay=document.getElementById('btnPlay');let tocando=false;
btnPlay.onclick=async()=>{
 if(!tocando){await radio.play();tocando=true;btnPlay.innerHTML='⏸️ PAUSAR';
  if('mediaSession' in navigator){
   navigator.mediaSession.metadata=new MediaMetadata({title:'MANO SHOW AO VIVO',artist:'Blumenau SC',artwork:[{src:'logo.png',sizes:'512x512',type:'image/png'}]});
   navigator.mediaSession.setActionHandler('pause',()=>{radio.pause();tocando=false;btnPlay.innerHTML='▶️ OUVIR';});
  }
 }else{radio.pause();tocando=false;btnPlay.innerHTML='▶️ OUVIR';}
};
document.addEventListener('visibilitychange',()=>{if(tocando&&document.hidden)radio.play().catch(()=>{});});
// REC SÓ AUDIO
let rec,partes=[],gravando=false;
async function gravar(){
 const btn=document.getElementById('btnRec'),player=document.getElementById('playerGravacao'),info=document.getElementById('info');
 if(!gravando){
  const stream=await navigator.mediaDevices.getUserMedia({audio:true,video:false});
  rec=new MediaRecorder(stream,{mimeType:'audio/webm;codecs=opus'});partes=[];
  rec.ondataavailable=e=>partes.push(e.data);
  rec.onstop=()=>{const blob=new Blob(partes,{type:'audio/webm'});player.src=URL.createObjectURL(blob);player.style.display='block';info.innerHTML='✅ Áudio gravado!';stream.getTracks().forEach(t=>t.stop());};
  rec.start();gravando=true;btn.classList.add('gravando');info.innerHTML='🔴 Gravando...';
 }else{rec.stop();gravando=false;btn.classList.remove('gravando');}
}
</script>
</body>
</html>
