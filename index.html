<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#1e4fff;color:#fff;font-family:Arial;text-align:center;padding-bottom:120px}
.capa{width:94%;max-width:420px;margin:12px auto;background:#000;border-radius:30px;height:420px;overflow:hidden;position:relative}

@keyframes piscar{0%{opacity:1}50%{opacity:.3}100%{opacity:1}}
.barra{background:#fff;color:#000;border-radius:50px;padding:14px;margin:12px auto;width:94%;max-width:420px;display:flex;gap:10px;text-align:left;align-items:center}
.player{display:flex;gap:10px;width:94%;max-width:420px;margin:15px auto}
.btn{flex:1;background:#1438ff;border:2px solid #2a4bff;color:#fff;font-size:18px;font-weight:900;padding:18px;border-radius:30px}
.btn-gravar{background:#ff0f0f}
.menu{position:fixed;bottom:0;left:0;width:100%;background:#1e4fff;padding:10px 0 20px;display:flex;justify-content:space-around}
.item{color:#fff;text-decoration:none;font-size:10px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:5px;width:16%;cursor:pointer}
.ico{width:50px;height:50px;background:#0d2fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;border:2px solid rgba(255,255,255,.3)}
</style>

<body>

<div class="barra"><div>🎵</div><div style="overflow:hidden"><div style="font-size:10px;opacity:.6">Tocando agora</div><b id="nome" style="font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Mano Show Ao Vivo</b><small id="artista" style="opacity:.7"></small></div></div>
<div class="player">
<button class="btn" id="play">▶️ OUVIR</button>

</div>

<h2>📻 MANO SHOW</h2>
<a href="https://wa.me/5547991452690" style="background:#25D366;color:#fff;padding:15px 40px;border-radius:30px;text-decoration:none;font-weight:900;width:90%;max-width:300px;text-align:center">WHATSAPP</a>
<a href="https://www.facebook.com/share/18wbZj1F72/" style="background:#1877F2;color:#fff;padding:15px 40px;border-radius:30px;text-decoration:none;font-weight:900;width:90%;max-width:300px;text-align:center">FACEBOOK</a>
<a href="https://www.instagram.com/manoshow.oficial" style="background:#E4405F;color:#fff;padding:15px 40px;border-radius:30px;text-decoration:none;font-weight:900;width:90%;max-width:300px;text-align:center">INSTAGRAM</a>
<a href="https://www.tiktok.com/@manoshowwebradio" style="background:#000;color:#fff;padding:15px 40px;border-radius:30px;text-decoration:none;font-weight:900;width:90%;max-width:300px;text-align:center">TIKTOK</a>
<a href="https://youtube.com/@webradiomanoshow" style="background:#FF0000;color:#fff;padding:15px 40px;border-radius:30px;text-decoration:none;font-weight:900;width:90%;max-width:300px;text-align:center">YOUTUBE</a>
<div style="color:#fff;margin-top:20px">Toque para fechar ✕</div>
</div>
<audio id="radio" src="https://stream.zeno.fm/0ctt516rnhovv" preload="none" crossorigin="anonymous"></audio>
<script>
const r=document.getElementById('radio'), b=document.getElementById('play'), g=document.getElementById('gravar'), recTag=document.getElementById('REC');
const capaEl=document.getElementById('capa'), nomeEl=document.getElementById('nome'), artEl=document.getElementById('artista');
const LOGO='https://mano-240.github.io/mano-show/logo.png';
let audioCtx, source, processor, mp3Encoder, mp3Chunks=[], gravando=false;

b.onclick=async()=>{
 if(r.paused){
  await r.play(); b.textContent='⏸️ PAUSAR';
  if('mediaSession' in navigator){
   navigator.mediaSession.metadata = new MediaMetadata({title: nomeEl.textContent, artist: artEl.textContent||'Mano Show', artwork:[{src:capaEl.src, sizes:'512x512', type:'image/png'}]});
  }
 } else{ r.pause(); b.textContent='▶️ OUVIR'; }
};

g.onclick=async()=>{
 if(!gravando){
  if(r.paused){ alert('Clica em OUVIR primeiro!'); return; }
  if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended') await audioCtx.resume();
  if(!source){ source = audioCtx.createMediaElementSource(r); source.connect(audioCtx.destination); }
  mp3Encoder = new lamejs.Mp3Encoder(1, audioCtx.sampleRate, 128);
  mp3Chunks=[]; processor = audioCtx.createScriptProcessor(4096,1,1);
  processor.onaudioprocess=(e)=>{
    let data=e.inputBuffer.getChannelData(0); let int16=new Int16Array(data.length);
    for(let i=0;i<data.length;i++) int16[i]=data[i]*32767;
    let mp3=mp3Encoder.encodeBuffer(int16); if(mp3.length>0) mp3Chunks.push(mp3);
  };
  source.connect(processor); processor.connect(audioCtx.destination);
  gravando=true; g.textContent='⏹️ PARAR'; recTag.style.display='block';
 }else{
  processor.disconnect();
  let final=mp3Encoder.flush(); if(final.length>0) mp3Chunks.push(final);
  if(mp3Chunks.length>0){
   let blob=new Blob(mp3Chunks,{type:'audio/mp3'}); let url=URL.createObjectURL(blob);
   let a=document.createElement('a'); a.href=url; a.download='mano-show-'+Date.now()+'.mp3'; a.click();
   setTimeout(()=>URL.revokeObjectURL(url),1000);
  }
  gravando=false; g.textContent='⏺️ GRAVAR'; recTag.style.display='none'; mp3Chunks=[];
 }
};

async function busca(){
 try{
  let api='https://api.allorigins.win/raw?url='+encodeURIComponent('https://zenoplay.zenomedia.com/api/zenofm/now-playing/0ctt516rnhovv');
  let res=await fetch(api); let j=await res.json();
  let titulo=j.title||j.song||j.now_playing?.song?.text||'';
  let artista=j.artist||j.now_playing?.song?.artist||'';
  let imagem=j.image||j.art||j.now_playing?.song?.art||j.now_playing?.song?.image||'';

  if(titulo){
   nomeEl.textContent=titulo;
   artEl.textContent=artista;
   if('mediaSession' in navigator &&!r.paused){
     navigator.mediaSession.metadata = new MediaMetadata({title:titulo, artist:artista||'Mano Show', artwork:[{src:imagem||LOGO, sizes:'512x512', type:'image/png'}]});
   }
  }
  if(imagem && imagem.startsWith('http')){
   capaEl.src=imagem;
  }else{
   // se não achou capa, mantém a logo
   if(capaEl.src!==LOGO &&!imagem) capaEl.src=LOGO;
  }
 }catch(e){}
}
capaEl.onerror=()=>{ capaEl.src=LOGO; };
setInterval(busca,7000); busca();
</script>
</body>
</html>
